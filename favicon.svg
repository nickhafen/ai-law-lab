<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#1a1a2e"/>

  <!-- Neural network connections -->
  <line x1="8" y1="10" x2="16" y2="16" stroke="#4a9eff" stroke-width="1" opacity="0.6"/>
  <line x1="8" y1="22" x2="16" y2="16" stroke="#4a9eff" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="16" x2="24" y2="10" stroke="#4a9eff" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="16" x2="24" y2="22" stroke="#4a9eff" stroke-width="1" opacity="0.6"/>
  <line x1="8" y1="10" x2="8" y2="22" stroke="#4a9eff" stroke-width="0.8" opacity="0.4"/>
  <line x1="24" y1="10" x2="24" y2="22" stroke="#4a9eff" stroke-width="0.8" opacity="0.4"/>

  <!-- Input nodes -->
  <circle cx="8" cy="10" r="2.5" fill="#4a9eff"/>
  <circle cx="8" cy="22" r="2.5" fill="#4a9eff"/>

  <!-- Hidden layer node (center) -->
  <circle cx="16" cy="16" r="3.5" fill="#a855f7"/>

  <!-- Output nodes -->
  <circle cx="24" cy="10" r="2.5" fill="#4a9eff"/>
  <circle cx="24" cy="22" r="2.5" fill="#4a9eff"/>
</svg>
